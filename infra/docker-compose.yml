services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: scenicnav
      MYSQL_USER: scenicnav
      MYSQL_PASSWORD: ${SCENICNAV_DB_PASSWORD:?请在终端设置数据库密码}
      MYSQL_ROOT_PASSWORD: ${SCENICNAV_DB_ROOT_PASSWORD:?请在终端设置根密码}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ../scenicnav-server/sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  valhalla:
    image: ghcr.io/gis-ops/docker-valhalla/valhalla:latest
    ports:
      - "8002:8002"
    volumes:
      - ./valhalla/custom_files:/custom_files
    environment:
      tile_urls: ${VALHALLA_TILE_URLS:-}
      use_tiles_ignore_pbf: "False"
      force_rebuild: "False"
      build_elevation: "False"
      serve_tiles: "True"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/status"]
      interval: 15s
      timeout: 5s
      retries: 20

volumes:
  mysql-data:
  redis-data:

