services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: scenicnav
      MYSQL_USER: scenicnav
      MYSQL_PASSWORD: ${SCENICNAV_DB_PASSWORD:?请在终端设置数据库密码}
      MYSQL_ROOT_PASSWORD: ${SCENICNAV_DB_ROOT_PASSWORD:?请在终端设置根密码}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ../scenicnav-server/sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

volumes:
  mysql-data:
  redis-data:

